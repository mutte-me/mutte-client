name: Build terminal client release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'mutte-me/mutte-client'
    name: ${{ matrix.platform }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: client-release-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
      - name: Build release binary
        run: cargo build --locked --release --package mutte
      - name: Sign and submit macOS binary for notarization
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required macOS release secret: $name" >&2
              exit 1
            fi
          done

          umask 077
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/notary-key.p8"
          keychain_path="$RUNNER_TEMP/mutte-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          notarization_archive="$RUNNER_TEMP/mutte-notarization.zip"
          submission_path="$RUNNER_TEMP/notary-submission.json"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | \
            openssl base64 -d -A > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | \
            openssl base64 -d -A > "$notary_key_path"

          cleanup_signing_keychain() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
          }
          trap cleanup_signing_keychain EXIT

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | \
            grep -F "$APPLE_SIGNING_IDENTITY"

          codesign \
            --force \
            --identifier me.mutte.terminal \
            --options runtime \
            --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            target/release/mutte
          codesign --verify --strict --verbose=2 target/release/mutte

          ditto -c -k --keepParent \
            target/release/mutte \
            "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --output-format json > "$submission_path"
          jq -er '.id | select(type == "string" and length > 0)' \
            "$submission_path"
      - name: Upload notarization submission
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: notary-${{ matrix.platform }}
          path: ${{ runner.temp }}/notary-submission.json
          if-no-files-found: error
          retention-days: 7
      - name: Package binary and checksum
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-alpha.1-${GITHUB_SHA::12}"
          fi
          ./scripts/package-client.sh "$version" "$PLATFORM"
      - name: Attest release provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: mutte-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  notarize:
    if: github.repository == 'mutte-me/mutte-client' && github.ref_type == 'tag'
    needs: build
    name: notarize-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: notary-${{ matrix.platform }}
          path: notary
      - name: Wait for Apple notarization acceptance
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for name in \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required macOS notarization secret: $name" >&2
              exit 1
            fi
          done

          umask 077
          submission_path="$GITHUB_WORKSPACE/notary/notary-submission.json"
          submission_id="$(jq -er \
            '.id | select(type == "string" and length > 0)' \
            "$submission_path")"
          notary_key_path="$RUNNER_TEMP/notary-key.p8"
          status_path="$RUNNER_TEMP/notary-status.json"
          deadline=$((SECONDS + 9900))

          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | \
            openssl base64 -d -A > "$notary_key_path"

          show_notarization_log() {
            xcrun notarytool log "$submission_id" \
              --key "$notary_key_path" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" || true
          }

          while ((SECONDS < deadline)); do
            xcrun notarytool info "$submission_id" \
              --key "$notary_key_path" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --output-format json > "$status_path"
            status="$(jq -er '.status' "$status_path")"
            echo "Apple notarization status for $submission_id: $status"

            case "$status" in
              Accepted)
                exit 0
                ;;
              Invalid|Rejected)
                show_notarization_log
                exit 1
                ;;
              "In Progress")
                sleep 30
                ;;
              *)
                echo "Unexpected Apple notarization status: $status" >&2
                show_notarization_log
                exit 1
                ;;
            esac
          done

          echo "Apple notarization did not finish within 165 minutes" >&2
          show_notarization_log
          exit 1

  release:
    if: github.repository == 'mutte-me/mutte-client' && github.ref_type == 'tag'
    needs: [build, notarize]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: mutte-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Mutte $GITHUB_REF_NAME" \
            "${release_flags[@]}"
