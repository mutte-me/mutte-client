[workspace]
members = [
    "apps/mutte",
    "crates/mutte-client",
    "crates/mutte-core",
    "crates/mutte-protocol",
    "crates/mutte-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.94.1"
authors = ["Mutte contributors"]

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.31"
hkdf = "0.12.4"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "crypto-rust", "sync-secret-service"] }
openmls = { version = "0.9.0", features = ["libcrux-provider"] }
openmls_basic_credential = "0.6.0"
openmls_libcrux_crypto = "0.4.0"
openmls_traits = "0.6.0"
rand = "0.9.2"
ratatui = "0.30.2"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls"] }
rpassword = "7.5.4"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
