        conversation_id: {$ref: "#/components/schemas/Uuid"}
        sender_device_id: {$ref: "#/components/schemas/Uuid"}
        sender_handle: {type: string}
        recipients: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/components/schemas/Uuid"}}
        kind: {type: string, enum: [welcome, application, commit, device_sync, history_sync]}
        mutation_id: {$ref: "#/components/schemas/Uuid"}
        ciphertext: {type: string, contentEncoding: base64url, maxLength: 1048576}
        created_at: {$ref: "#/components/schemas/DateTime"}
    MessageBatch:
      type: object
