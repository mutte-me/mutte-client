        attachment_id: {$ref: "#/components/schemas/Uuid"}
        recipients: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/components/schemas/Uuid"}}
        chunk_count: {type: integer, minimum: 0, maximum: 128}
        ciphertext_size: {type: integer, minimum: 0, maximum: 33559552}
    AttachmentStatus:
      type: object
